# Catalogue STLKM — schéma v1
#
# Le contenu du dépôt `stlkm-catalog` : la liste des applications que les
# utilisateurs du hub peuvent installer. Tu l'édites depuis l'Atelier ou à la
# main ; les binaires, eux, restent dans les GitHub Releases de chaque projet.

schema = 1

# Dépôts que le répertoire n'affiche pas

# Dépôts que le répertoire n'affiche pas

[[project]]
id = "cleanfiles"
name = "cleanFiles"
source = { kind = "github-repo", repo = "Yurogin/cleanFiles" }
launch = { kind = "terminal", command = { windows = "python cleanfiles.py", linux = "python3 cleanfiles.py" } }

[[project]]
id = "easystart"
name = "easyStart"
source = { kind = "github-repo", repo = "Yurogin/easyStart" }
launch = { kind = "terminal", command = { windows = "python easyStart.py", linux = "python3 easyStart.py" } }
