# Catalogue STLKM — schéma v1
#
# Le contenu du dépôt `stlkm-catalog` : la liste des applications que les
# utilisateurs du hub peuvent installer. Tu l'édites depuis l'Atelier ou à la
# main ; les binaires, eux, restent dans les GitHub Releases de chaque projet.

schema = 1

# Dépôts que le répertoire n'affiche pas
hidden = ["cleanfiles", "discordb", "yurogin", "easystart"]

[[project]]
id = "cleanfiles"
name = "cleanFiles"
source = { kind = "github-repo", repo = "Yurogin/cleanFiles" }
launch = { kind = "terminal", command = { windows = "python cleanfiles.py", linux = "python3 cleanfiles.py" } }

[[project]]
id = "easystart"
name = "easyStart"
source = { kind = "github-repo", repo = "Yurogin/easyStart" }
launch = { kind = "terminal", command = { windows = "python easyStart.py", linux = "python3 easyStart.py" } }

[[project]]
id = "tokenlauncherdiscord"
name = "Token Launcher"
source = { kind = "github-repo", repo = "Yurogin/tokenLauncherDiscord" }
launch = { kind = "terminal", command = "npm start" }

[[project]]
id = "klaxon"
name = "Klaxon"
summary = "Klaxonne tes potes d'ordinateur à ordinateur : une touche qui marche partout, en fond à côté de l'horloge."
source = { kind = "github-release", repo = "Yurogin/klaxon", asset = { windows = "Klaxon.exe", android = "Klaxon-telephone.apk" } }
launch = { kind = "process", exec = { windows = "Klaxon.exe", android = "fr.stlkm.klaxon" } }

[[project]]
id = "perquiz"
name = "Perquiz"
summary = "Une perquisition de ton disque déguisée en quiz : dix questions sur ton PC, fouillé pour de vrai pendant que tu réponds."
source = { kind = "github-repo", repo = "Yurogin/Perquiz" }
launch = { kind = "process", exec = { windows = "Perquiz.exe" } }

[[project]]
id = "stlkm-mobile"
name = "STLKM mobile"
summary = "Le hub sur téléphone : tes applis Android en un endroit, installées et tenues à jour."
platforms = ["android"]
source = { kind = "github-release", repo = "Yurogin/stlkm-mobile", asset = { android = "STLKM.apk" } }
launch = { kind = "process", exec = { android = "fr.stlkm.hub" } }
